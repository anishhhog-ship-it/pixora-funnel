# Netlify Configuration for Web Subdirectory
[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"

[functions."sync-google-reviews"]
  schedule = "0 */3 * * *"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_PROJECT_ID,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_GOOGLE_PLACES_API_KEY,GOOGLE_MY_BUSINESS_ACCOUNT_API_KEY,GOOGLE_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_MAPS_API_KEY,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,GOOGLE_PLACES_API_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
